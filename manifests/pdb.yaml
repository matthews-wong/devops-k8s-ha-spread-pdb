apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ha-spread-pdb
spec:
  # With 3 replicas this allows a single voluntary eviction at a time.
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: web
